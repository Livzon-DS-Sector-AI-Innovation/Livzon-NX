name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "10.33.0"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.4"
  PYTHONUTF8: "1"

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      frontend_changed: ${{ steps.scope.outputs.frontend_changed }}
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
      hermes_changed: ${{ steps.scope.outputs.hermes_changed }}
      docker_changed: ${{ steps.scope.outputs.docker_changed }}
      shared_changed: ${{ steps.scope.outputs.shared_changed }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Resolve changed scopes
        id: scope
        env: &ci_revision_range
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/change_scope.py

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv for CI policy tests
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Verify Claude Code instruction bridges
        run: python scripts/check-agent-instruction-bridges.py

      - name: Test CI policies and repository scripts
        run: |
          python -m pip install pytest==9.0.3 PyYAML==6.0.3
          python -m pytest .github/scripts/tests scripts/tests -q

      - name: Verify production changes include corresponding tests
        env: *ci_revision_range
        run: python scripts/check-test-impact.py

  source-security:
    name: Source Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate complete Trivy source report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-source.json
          exit-code: "0"

      - name: Enforce source security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Upload source security report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-security-report
          path: trivy-source.json
          if-no-files-found: warn
          retention-days: 14

  ci-tools:
    name: CI Tools Image
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.hermes_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_TAG: dazah-ci-tools:${{ github.sha }}
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
      cached_steps: ${{ steps.cache.outputs.cached_steps }}
      total_steps: ${{ steps.cache.outputs.total_steps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set OS package refresh week
        id: refresh
        run: printf 'week=%s\n' "$(date --utc +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build CI tools with persistent cache
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: docker
          file: docker/Dockerfile.ci-tools
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: CI_TOOLS_WEEK=${{ steps.refresh.outputs.week }}
          cache-from: type=gha,scope=ci-tools
          cache-to: type=gha,mode=max,scope=ci-tools

      - &docker_cache_stats
        name: Collect Docker image cache statistics
        id: cache
        if: ${{ always() }}
        continue-on-error: true
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: python3 .github/scripts/ci_metrics.py build-cache

      - name: Verify and export CI tools image
        id: export
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --pull=never --network none \
            --env PYTHON_VERSION --env UV_VERSION \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/ci_support.py,dst=/ci/.github/scripts/ci_support.py,readonly" \
            "$image_id" bash -euc '
              python3 /ci/.github/scripts/ci_support.py preflight tools
              psql --version
              pg_isready --version
              test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
            '
          docker image save --output "$RUNNER_TEMP/ci-tools-image.tar" "$IMAGE_TAG"
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Upload CI tools image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-tools-image
          path: ${{ runner.temp }}/ci-tools-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: true

  frontend-quality:
    name: Frontend Quality
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      pnpm_cache_hit: ${{ steps.node.outputs.cache-hit }}
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      API_BASE_URL: http://127.0.0.1:4100
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: Set up Python for coverage policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies once
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contract
        run: |
          pnpm generate:api
          git diff --exit-code -- src/types/generated/schema.ts

      - name: Verify frontend page discovery inventory
        run: python ../scripts/generate-page-routes.py --check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Verify bounded build failure and type coverage guards
        run: pnpm test:build

      - name: Test stable E2E shard planning
        run: node --test scripts/plan-critical-e2e-shard.test.mjs

  frontend-build:
    name: Frontend Build
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      pnpm_cache_hit: ${{ steps.node.outputs.cache-hit }}
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      API_BASE_URL: http://127.0.0.1:4100
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm build

      - name: Package frontend bundle for E2E
        run: tar -czf "$RUNNER_TEMP/frontend-e2e-bundle.tar.gz" .next/standalone .next/static

      - name: Upload frontend E2E bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-e2e-bundle
          path: ${{ runner.temp }}/frontend-e2e-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  frontend-unit:
    name: Frontend Unit (${{ matrix.shard }}/3)
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      API_BASE_URL: http://127.0.0.1:4100
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: pnpm store cache ${{ steps.node.outputs.cache-hit }}
        run: echo "Recorded pnpm cache status for this shard."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pnpm test:coverage --shard="$SHARD/3" --reporter=blob
          --outputFile="$RUNNER_TEMP/frontend-vitest-$SHARD.json"

      - name: Upload Vitest shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-vitest-${{ matrix.shard }}
          path: ${{ runner.temp }}/frontend-vitest-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  frontend-coverage:
    name: Frontend Coverage
    needs:
      - change-scope
      - frontend-unit
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pnpm_cache_hit: ${{ steps.node.outputs.cache-hit }}
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: Set up Python for coverage policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Vitest shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: frontend-vitest-*
          path: ${{ runner.temp }}/frontend-vitest
          merge-multiple: true

      - name: Merge Vitest reports and enforce coverage gates
        run: |
          for shard in 1 2 3; do
            report="$RUNNER_TEMP/frontend-vitest/frontend-vitest-$shard.json"
            if [[ ! -s "$report" ]]; then
              echo "::error::Missing Vitest coverage report for shard $shard/3"
              exit 1
            fi
          done
          pnpm exec vitest run --merge-reports="$RUNNER_TEMP/frontend-vitest" --coverage
          python ../scripts/check-diff-coverage.py \
            --coverage-file coverage/cobertura-coverage.xml \
            --path-prefix dazah-frontend \
            --minimum 80

      - name: Upload frontend coverage
        if: ${{ always() && hashFiles('dazah-frontend/coverage/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage
          path: dazah-frontend/coverage
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  frontend-image-verify:
    name: Frontend Image Verify
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      cached_steps: ${{ steps.cache.outputs.cached_steps }}
      total_steps: ${{ steps.cache.outputs.total_steps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate Compose
        run: docker compose --env-file /dev/null -f compose.dev.yml config --no-interpolate --quiet

      - name: Build frontend image with persistent cache
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          target: frontend
          load: true
          tags: dazah-frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - *docker_cache_stats

  frontend-e2e:
    name: Stable Frontend E2E (${{ matrix.shard }}/4)
    needs:
      - change-scope
      - frontend-build
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      API_BASE_URL: http://127.0.0.1:4100
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: pnpm store cache ${{ steps.node.outputs.cache-hit }}
        run: echo "Recorded pnpm cache status for this shard."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Chromium runtime
        run: >-
          pnpm exec node -e 'const {chromium}=require("@playwright/test");
          (async()=>{const browser=await chromium.launch({channel:"chromium"});await browser.close()})()
          .catch(error=>{console.error(error);process.exit(1)})'

      - name: Download frontend E2E bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-e2e-bundle
          path: dazah-frontend

      - name: Restore frontend E2E bundle
        run: tar -xzf frontend-e2e-bundle.tar.gz

      - name: Run stable critical Playwright tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          inventory="$RUNNER_TEMP/frontend-e2e-inventory.json"
          excluded="$RUNNER_TEMP/frontend-e2e-excluded.txt"
          results="$RUNNER_TEMP/frontend-e2e-results.json"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$inventory" pnpm test:e2e:critical --grep-invert @flaky --list --reporter=json
          node scripts/plan-critical-e2e-shard.mjs "$inventory" "$SHARD" "$excluded"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$results" pnpm test:e2e:critical --grep-invert @flaky --reporter=html,json --test-list-invert="$excluded"
          node scripts/plan-critical-e2e-shard.mjs "$inventory" "$SHARD" "$excluded" "$results"

      - name: Upload stable E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-e2e-report-${{ matrix.shard }}
          path: |
            dazah-frontend/playwright-report
            dazah-frontend/test-results
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  frontend-flaky-quarantine:
    name: Frontend Flaky Quarantine
    needs:
      - change-scope
      - frontend-build
    if: >-
      ${{ needs.change-scope.outputs.frontend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dazah-frontend
    env:
      API_BASE_URL: http://127.0.0.1:4100
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect quarantined tests
        id: flaky
        shell: bash
        run: |
          if grep -R -E --include='*.spec.ts' '@flaky' e2e; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "### Flaky quarantine" >> "$GITHUB_STEP_SUMMARY"
            echo "No tests tagged \`@flaky\` are currently quarantined." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        if: ${{ steps.flaky.outputs.found == 'true' }}
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        if: ${{ steps.flaky.outputs.found == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dazah-frontend/pnpm-lock.yaml

      - name: Install dependencies and Chromium
        if: ${{ steps.flaky.outputs.found == 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Download frontend E2E bundle
        if: ${{ steps.flaky.outputs.found == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-e2e-bundle
          path: dazah-frontend

      - name: Restore frontend E2E bundle
        if: ${{ steps.flaky.outputs.found == 'true' }}
        run: tar -xzf frontend-e2e-bundle.tar.gz

      - name: Run quarantined Playwright tests
        if: ${{ steps.flaky.outputs.found == 'true' }}
        run: pnpm exec playwright test --grep @flaky

      - name: Upload quarantine report
        if: ${{ always() && steps.flaky.outputs.found == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-flaky-quarantine-report
          path: |
            dazah-frontend/playwright-report
            dazah-frontend/test-results
          if-no-files-found: warn
          retention-days: 14

  backend-quality:
    name: Backend Quality
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      uv_cache_hit: ${{ steps.uv.outputs.cache-hit }}
      phases: ${{ steps.phases.outputs.phases }}
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: dazah-backend/uv.lock

      - &backend_test_toolchain
        name: Verify CI toolchain
        run: >-
          python3 .github/scripts/ci_support.py run --phase toolchain --category environment --
          python3 .github/scripts/ci_support.py preflight tools

      - &backend_test_dependencies
        name: Install backend dependencies
        run: python3 .github/scripts/ci_support.py install backend

      - name: Verify shipped frontend page inventory
        run: python3 scripts/generate-page-routes.py --check

      - name: Run backend quality checks
        run: >-
          python3 .github/scripts/ci_support.py run --phase backend-quality --category quality --
          bash dazah-backend/scripts/ci.sh quality-checks

      - name: Export CI phase observations
        id: phases
        if: ${{ always() }}
        continue-on-error: true
        run: python3 .github/scripts/ci_support.py summarize

  backend-migrations:
    name: Backend Migrations and Contracts
    needs: [change-scope, ci-tools]
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      uv_cache_hit: ${{ steps.uv.outputs.cache-hit }}
      phases: ${{ steps.phases.outputs.phases }}
    services: &backend_test_services
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dazah_ci
          POSTGRES_PASSWORD: dazah_ci_test
          POSTGRES_DB: dazah_ci_test
          POSTGRES_INITDB_ARGS: "-c max_connections=300 -c idle_in_transaction_session_timeout=60000 -c idle_session_timeout=180000"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dazah_ci -d dazah_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env: &backend_test_env
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: dazah_ci
      PGPASSWORD: dazah_ci_test
      PGDATABASE: dazah_ci_test
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dazah_ci:dazah_ci_test@localhost:5432/dazah_ci_test
      TEST_DATABASE_URL: postgresql+asyncpg://dazah_ci:dazah_ci_test@localhost:5432/dazah_ci_test
      REDIS_URL: redis://localhost:6379/0
      MAINTENANCE_TEST_REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-only-secret-key
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      FRONTEND_URL: http://localhost:3000
      FEISHU_WS_ENABLED: "false"
      EQUIPMENT_FEISHU_WS_ENABLED: "false"
      LIVZON_FEISHU_CARD_CALLBACK_WS_ENABLED: "false"
      LIVZON_FEISHU_EVENT_WS_ENABLED: "false"
      MINIO_ENABLED: "false"
    steps:
      - &backend_test_checkout
        name: Check out repository with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - &backend_test_python
        name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - &backend_test_uv
        name: Set up uv
        id: uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: dazah-backend/uv.lock

      - &ci_tools_download
        name: Download CI tools image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-tools-image
          path: ${{ runner.temp }}

      - &ci_tools_load
        name: Load verified CI tools image
        env:
          CI_TOOLS_IMAGE_ID: ${{ needs.ci-tools.outputs.image_id }}
        run: bash .github/scripts/ci-tools.sh load "$RUNNER_TEMP/ci-tools-image.tar"

      - &ci_tools_preflight
        name: Verify CI toolchain
        shell: &ci_tools_shell bash --noprofile --norc .github/scripts/ci-tools.sh {0}
        run: >-
          python3 .github/scripts/ci_support.py run --phase toolchain --category environment --
          python3 .github/scripts/ci_support.py preflight tools

      - &ci_tools_backend_dependencies
        name: Install backend dependencies
        shell: *ci_tools_shell
        run: python3 .github/scripts/ci_support.py install backend

      - &backend_test_environment
        name: Verify backend environment
        shell: *ci_tools_shell
        run: |
          cd dazah-backend
          python3 ../.github/scripts/ci_support.py run --phase backend-environment --category environment -- \
            uv run --no-sync python ../.github/scripts/ci_support.py preflight backend

      - name: Verify backend migrations and contracts
        shell: *ci_tools_shell
        run: >-
          python3 .github/scripts/ci_support.py run --phase backend-migrations --category migration --
          bash dazah-backend/scripts/ci.sh prepare-integration

      - &backend_test_phases
        name: Export CI phase observations
        id: phases
        if: ${{ always() }}
        continue-on-error: true
        run: python3 .github/scripts/ci_support.py summarize

  backend-integration:
    name: Backend Integration (${{ matrix.shard }}/4)
    needs: [change-scope, ci-tools]
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services: *backend_test_services
    env: *backend_test_env
    steps:
      - *backend_test_checkout
      - *backend_test_python
      - *backend_test_uv

      - name: uv cache ${{ steps.uv.outputs.cache-hit }}
        run: echo "Recorded uv cache status for this shard."

      - *ci_tools_download
      - *ci_tools_load
      - *ci_tools_preflight
      - *ci_tools_backend_dependencies
      - *backend_test_environment

      - name: Migrate backend shard database
        shell: *ci_tools_shell
        run: >-
          python3 .github/scripts/ci_support.py run --phase backend-migrations --category migration --
          bash dazah-backend/scripts/ci.sh migrate-test-database

      - name: Run backend test shard
        shell: *ci_tools_shell
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python3 .github/scripts/ci_support.py run --phase backend-tests --category tests --
          bash dazah-backend/scripts/ci.sh integration-shard
          "$SHARD" "$RUNNER_TEMP/backend-integration-shard-$SHARD"

      - name: Upload backend shard reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-integration-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  backend-coverage:
    name: Backend Coverage
    needs:
      - change-scope
      - backend-integration
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      uv_cache_hit: ${{ steps.uv.outputs.cache-hit }}
      phases: ${{ steps.phases.outputs.phases }}
    env:
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - *backend_test_checkout
      - *backend_test_python
      - *backend_test_uv
      - *backend_test_toolchain
      - *backend_test_dependencies

      - name: Download backend shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: backend-integration-shard-*
          path: ${{ runner.temp }}/backend-shards
          merge-multiple: false

      - name: Enforce backend coverage gates
        run: >-
          python3 .github/scripts/ci_support.py run --phase backend-coverage --category coverage --
          bash dazah-backend/scripts/ci.sh merge-shard-coverage "$RUNNER_TEMP/backend-shards"

      - name: Upload backend coverage report
        if: ${{ always() && hashFiles('dazah-backend/coverage.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-coverage
          path: dazah-backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - *backend_test_phases

  backend-image-verify:
    name: Backend Production Image Verify
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
          needs.change-scope.outputs.shared_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs: &docker_cache_outputs
      cached_steps: ${{ steps.cache.outputs.cached_steps }}
      total_steps: ${{ steps.cache.outputs.total_steps }}
    env:
      IMAGE_TAG: dazah-backend:ci-${{ github.sha }}
      NETWORK_NAME: dazah-backend-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend production image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          target: backend
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - *docker_cache_stats

      - name: Generate complete image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-backend-image.json
          exit-code: "0"

      - name: Enforce image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - &backend_chromium_check
        name: Verify Chromium as app
        shell: bash
        run: |
          timeout 60s docker run --rm --interactive --network none \
            --user app --entrypoint .venv/bin/python "$IMAGE_TAG" - <<'PY'
          import os
          import pwd
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          assert pwd.getpwuid(os.geteuid()).pw_name == "app"
          cache = Path(os.environ["XDG_CACHE_HOME"]) / "ms-playwright"
          assert cache.is_dir(), f"Browser cache missing: {cache}"
          assert cache.stat().st_uid == os.geteuid(), "Browser cache must belong to app"
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
              assert os.access(executable, os.R_OK | os.X_OK), executable
              browser = playwright.chromium.launch(headless=True)
              try:
                  page = browser.new_page()
                  page.set_content("<div id='result'></div><script>document.getElementById('result').textContent = 'chromium-ok'</script>")
                  assert page.locator("#result").inner_text() == "chromium-ok"
                  print(f"Chromium {browser.version}: app user and JavaScript rendering OK")
              finally:
                  browser.close()
          PY

      - &backend_document_check
        name: Verify Chinese document conversion as app
        shell: bash
        run: |
          timeout 90s docker run --rm --interactive --network none \
            --user app --entrypoint .venv/bin/python "$IMAGE_TAG" - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          import pymupdf
          from docx import Document

          with tempfile.TemporaryDirectory() as directory:
              source = Path(directory) / "chinese.docx"
              document = Document()
              document.add_paragraph("原料药质量检验报告：含量99.5%，复核通过。")
              document.save(source)
              subprocess.run(
                  ["soffice", "--headless", "--convert-to", "pdf",
                   "--outdir", directory, str(source)],
                  capture_output=True, timeout=60, check=True,
              )
              output = source.with_suffix(".pdf")
              assert output.is_file(), "LibreOffice did not create a PDF"
              with pymupdf.open(output) as pdf:
                  text = "".join(page.get_text() for page in pdf)
                  assert "原料药" in text and "99.5%" in text, text
              print("soffice entrypoint and Chinese DOCX to PDF conversion OK")
          PY

      - name: Start isolated dependencies
        run: |
          docker network create "$NETWORK_NAME"
          docker run --detach --name dazah-ci-postgres \
            --network "$NETWORK_NAME" \
            --env POSTGRES_USER=dazah_ci \
            --env POSTGRES_PASSWORD=dazah_ci_test \
            --env POSTGRES_DB=dazah_ci_test \
            --health-cmd "pg_isready -U dazah_ci -d dazah_ci_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:17
          docker run --detach --name dazah-ci-redis \
            --network "$NETWORK_NAME" \
            --health-cmd "redis-cli ping" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            redis:8-alpine

      - name: Wait for isolated dependencies
        shell: bash
        run: |
          for container in dazah-ci-postgres dazah-ci-redis; do
            for attempt in {1..30}; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [[ "$status" == "healthy" ]]; then
                break
              fi
              if [[ "$status" == "unhealthy" || "$attempt" -eq 30 ]]; then
                docker logs "$container"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Migrate container database
        run: |
          docker run --rm \
            --network "$NETWORK_NAME" \
            --env APP_ENV=test \
            --env DATABASE_URL=postgresql+asyncpg://dazah_ci:dazah_ci_test@dazah-ci-postgres:5432/dazah_ci_test \
            --env TEST_DATABASE_URL=postgresql+asyncpg://dazah_ci:dazah_ci_test@dazah-ci-postgres:5432/dazah_ci_test \
            --env REDIS_URL=redis://dazah-ci-redis:6379/0 \
            --env SECRET_KEY=ci-only-secret-key \
            --env ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            --env FRONTEND_URL=http://localhost:3000 \
            "$IMAGE_TAG" \
            .venv/bin/alembic upgrade head

      - name: Start backend container
        run: |
          docker run --detach --name dazah-backend-ci \
            --network "$NETWORK_NAME" \
            --publish 8000:8000 \
            --env APP_ENV=test \
            --env DATABASE_URL=postgresql+asyncpg://dazah_ci:dazah_ci_test@dazah-ci-postgres:5432/dazah_ci_test \
            --env TEST_DATABASE_URL=postgresql+asyncpg://dazah_ci:dazah_ci_test@dazah-ci-postgres:5432/dazah_ci_test \
            --env REDIS_URL=redis://dazah-ci-redis:6379/0 \
            --env SECRET_KEY=ci-only-secret-key \
            --env ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            --env FRONTEND_URL=http://localhost:3000 \
            --env FEISHU_WS_ENABLED=false \
            --env EQUIPMENT_FEISHU_WS_ENABLED=false \
            --env LIVZON_FEISHU_CARD_CALLBACK_WS_ENABLED=false \
            --env LIVZON_FEISHU_EVENT_WS_ENABLED=false \
            --env MINIO_ENABLED=false \
            "$IMAGE_TAG"

      - name: Run bounded health and smoke checks
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8000/health \
            --output health.json
          python3 -c \
            "import json; assert json.load(open('health.json', encoding='utf-8')) == {'status': 'ok'}"
          docker inspect --format '{{.State.Running}}' dazah-backend-ci |
            grep --fixed-strings true

      - name: Print container logs on failure
        if: ${{ failure() }}
        run: |
          docker logs dazah-backend-ci 2>&1 || true
          docker logs dazah-ci-postgres 2>&1 || true
          docker logs dazah-ci-redis 2>&1 || true

      - name: Upload image vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-image-security-report
          path: trivy-backend-image.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up containers
        if: ${{ always() }}
        run: |
          docker rm --force dazah-backend-ci dazah-ci-postgres dazah-ci-redis \
            2>/dev/null || true
          docker network rm "$NETWORK_NAME" 2>/dev/null || true

  backend-dev-image-verify:
    name: Backend Development Image Verify
    needs: change-scope
    if: >-
      ${{ needs.change-scope.outputs.backend_changed == 'true' ||
