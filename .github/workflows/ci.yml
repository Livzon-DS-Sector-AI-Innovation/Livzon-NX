      - *ci_tools_preflight
      - *ci_tools_backend_dependencies
      - *backend_test_environment

      - name: Migrate contract database
        shell: *ci_tools_shell
        run: |
          cd dazah-backend
          python3 ../.github/scripts/ci_support.py run --phase contract-migrations --category migration -- \
            uv run --no-sync alembic upgrade head

      - name: Run backend Agent and Tool Registry contracts
        shell: *ci_tools_shell
        run: |
          cd dazah-backend
          python3 ../.github/scripts/ci_support.py run --phase backend-contract --category contract -- uv run --no-sync pytest \
            tests/modules/agent/test_agent_v2_contracts.py \
            tests/modules/agent/test_tool_registry_executor.py \
            tests/modules/agent/test_user_tool_api.py \
            -ra \
            --junitxml=.pytest_cache/hermes-contract-backend-junit.xml

      - name: Install Hermes contract dependencies
        shell: *ci_tools_shell
        run: python3 ../.github/scripts/ci_support.py install hermes

      - name: Run Hermes adapter contracts
        shell: *ci_tools_shell
        run: |
          cd Hermes-Lite
          python3 ../.github/scripts/ci_support.py run --phase hermes-contract --category contract -- uv run --no-sync pytest \
            tests/test_dazah_feishu_tool_payload.py \
            tests/test_dazah_backend_contract.py \
            -ra \
            --junitxml=.pytest_cache/hermes-contract-adapter-junit.xml

      - name: Upload Hermes contract reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-contract-reports
          path: |
            dazah-backend/.pytest_cache/hermes-contract-backend-junit.xml
            Hermes-Lite/.pytest_cache/hermes-contract-adapter-junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Export CI phase observations
        id: phases
        if: ${{ always() }}
        continue-on-error: true
        run: python3 .github/scripts/ci_support.py summarize

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - change-scope
      - repository-policy
      - source-security
      - ci-tools
      - frontend-quality
      - frontend-build
      - frontend-unit
      - frontend-coverage
      - frontend-image-verify
      - frontend-e2e
      - backend-quality
      - backend-migrations
      - backend-integration
      - backend-coverage
      - backend-image-verify
      - backend-dev-image-verify
      - hermes-quality
      - hermes-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out gate evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Evaluate required checks
        env:
          FRONTEND_CHANGED: ${{ needs.change-scope.outputs.frontend_changed }}
          BACKEND_CHANGED: ${{ needs.change-scope.outputs.backend_changed }}
          HERMES_CHANGED: ${{ needs.change-scope.outputs.hermes_changed }}
          DOCKER_CHANGED: ${{ needs.change-scope.outputs.docker_changed }}
          SHARED_CHANGED: ${{ needs.change-scope.outputs.shared_changed }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          REPOSITORY_POLICY_RESULT: ${{ needs.repository-policy.result }}
          SOURCE_SECURITY_RESULT: ${{ needs.source-security.result }}
          CI_TOOLS_RESULT: ${{ needs.ci-tools.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
          FRONTEND_UNIT_RESULT: ${{ needs.frontend-unit.result }}
          FRONTEND_COVERAGE_RESULT: ${{ needs.frontend-coverage.result }}
          FRONTEND_IMAGE_VERIFY_RESULT: ${{ needs.frontend-image-verify.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          BACKEND_MIGRATIONS_RESULT: ${{ needs.backend-migrations.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
          BACKEND_COVERAGE_RESULT: ${{ needs.backend-coverage.result }}
          BACKEND_IMAGE_VERIFY_RESULT: ${{ needs.backend-image-verify.result }}
          BACKEND_DEV_IMAGE_VERIFY_RESULT: ${{ needs.backend-dev-image-verify.result }}
          HERMES_QUALITY_RESULT: ${{ needs.hermes-quality.result }}
          HERMES_CONTRACT_RESULT: ${{ needs.hermes-contract.result }}
        run: python3 .github/scripts/ci_gate.py

      - name: Report CI timing and cache statistics
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_metrics.py report --output "$RUNNER_TEMP/ci-metrics.json"

      - name: Upload CI metrics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-metrics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics.json
          if-no-files-found: warn
          retention-days: 14

