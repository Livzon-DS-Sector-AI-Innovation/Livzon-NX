services:
  app:
    profiles:
      - app
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-dazah-backend}
      APP_ENV: ${APP_ENV:-development}
      # SQLAlchemy echo is extremely chatty with the development schedulers.
      # Enable it only for a targeted debugging session with APP_DEBUG=true.
      DEBUG: "${APP_DEBUG:-false}"
      # Poll the Windows bind mount so Uvicorn reload does not miss source changes.
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-true}"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/dazah}
      REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-dazah}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    command: >
      sh -c ".venv/bin/alembic upgrade head &&
      .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    restart: unless-stopped
    cpus: "${APP_CPU_LIMIT:-2.5}"
    mem_limit: "${APP_MEMORY_LIMIT:-4g}"
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  init:
    profiles:
      - init
    build: .
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
      - ./assets:/app/assets:ro
    command: >
      sh -c "
        echo '=== 同步部门 ===' &&
        uv run python -X utf8 scripts/tmp/sync_lizhu_departments.py &&
        echo '=== 同步人员 ===' &&
        uv run python -X utf8 scripts/tmp/sync_lizhu_members.py &&
        echo '=== 初始化完成 ==='
      "
    cpus: "${INIT_CPU_LIMIT:-1.0}"
    mem_limit: "${INIT_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dazah}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dazah}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: "${POSTGRES_CPU_LIMIT:-0.75}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: "${REDIS_CPU_LIMIT:-0.25}"
    mem_limit: "${REDIS_MEMORY_LIMIT:-512m}"
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: "${MINIO_CPU_LIMIT:-0.5}"
    mem_limit: "${MINIO_MEMORY_LIMIT:-768m}"
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  minio_data:
