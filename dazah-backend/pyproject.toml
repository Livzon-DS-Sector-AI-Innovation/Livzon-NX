[project]
name = "dazah-backend"
version = "0.1.0"
description = "原料药事业部工厂系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.2.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2",
    "pg8000>=1.31.5",
    "lark-oapi>=1.6.8",
    "pyjwt[crypto]>=2.10.0",
    "tqdm>=4.68.1",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.6",
    "playwright>=1.40.0",
    "openai>=2.41.0",
    "apscheduler>=3.10.0",
    "scikit-learn>=1.4",
    "scipy>=1.10.0",
    "ordered-set==4.0.2",
    "croniter>=6.2.2",
    "fastmcp>=3.4.2",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
    "pdf2image>=1.16.0",
    "pdfplumber>=0.11.0",
    "pypdf>=3.0.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.modules.agent.api"
# Transitional FastAPI boundary: endpoint signatures still use Annotated
# dependencies with ``= None`` and predominantly return response envelopes.
# Return annotations and dependency defaults are transitional; function bodies
# and every other strict mypy rule remain enabled.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "app.core.llm.api"
# Transitional FastAPI boundary matching the existing Annotated dependency
# convention. Keep endpoint bodies and all other strict checks enabled while
# response annotations and ``RequiredUser = None`` are migrated incrementally.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "app.platform.identity.api"
# FastAPI dependency aliases are non-optional at runtime but historically use
# ``= None`` so FastAPI can inject them. Keep every strict check except this
# framework-boundary assignment mismatch.
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
