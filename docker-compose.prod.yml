services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dazah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-dazah}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./dazah-backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-dazah-backend:prod}
    env_file:
      - .env.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
      .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_NAME: ${APP_NAME:-dazah-backend}
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dazah}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-86400}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_PREFIX: ${MINIO_BUCKET_PREFIX:-dazah}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      FEISHU_WS_ENABLED: ${FEISHU_WS_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_USER_USERNAME: ${BOOTSTRAP_USER_USERNAME:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
      BOOTSTRAP_USER_NAME: ${BOOTSTRAP_USER_NAME:-}
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      SSO_ADMIN_IDENTIFIERS: ${SSO_ADMIN_IDENTIFIERS:-}
      HERMES_AGENT_URL: http://hermes-lite:8100/v1/chat
      HERMES_AGENT_TOKEN: ${HERMES_AGENT_TOKEN:?HERMES_AGENT_TOKEN is required}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:?AGENT_TOOL_TOKEN is required}
      AGENT_LLM_PROXY_TOKEN: ${AGENT_LLM_PROXY_TOKEN:?AGENT_LLM_PROXY_TOKEN is required}
      AGENT_INTERNAL_API_BASE_URL: http://backend:8000/api/v1
      AGENT_INTERNAL_API_TOKEN: ${AGENT_INTERNAL_API_TOKEN:-}
      AGENT_WRITE_CONFIRM_TTL_SECONDS: ${AGENT_WRITE_CONFIRM_TTL_SECONDS:-300}
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  hermes-lite:
    build:
      context: ./Hermes-Lite
      dockerfile: Dockerfile
    image: ${HERMES_IMAGE:-hermes-lite:prod}
    env_file:
      - .env.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      HERMES_HOME: /data/hermes
      HERMES_AGENT_TOKEN: ${HERMES_AGENT_TOKEN:?HERMES_AGENT_TOKEN is required}
      AGENT_LLM_PROXY_TOKEN: ${AGENT_LLM_PROXY_TOKEN:?AGENT_LLM_PROXY_TOKEN is required}
      DAZAH_API_KEY: ${AGENT_LLM_PROXY_TOKEN:?AGENT_LLM_PROXY_TOKEN is required}
      DAZAH_API_BASE_URL: http://backend:8000/api/v1
      DAZAH_AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:?AGENT_TOOL_TOKEN is required}
      DAZAH_LLM_BASE_URL: http://backend:8000/api/v1/agent/llm
      DAZAH_LLM_MODEL: ${DAZAH_LLM_MODEL:-dazah-active-text}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - hermes_data:/data/hermes
    expose:
      - "8100"
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./dazah-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    image: ${FRONTEND_IMAGE:-dazah-frontend:prod}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles:
      - storage
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - dazah-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  dazah-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  hermes_data:
  minio_data:
