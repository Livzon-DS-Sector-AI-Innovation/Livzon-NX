services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL:-http://app:8000}
    networks:
      - backend
    restart: unless-stopped
    cpus: "${FRONTEND_CPU_LIMIT:-1.0}"
    mem_limit: "${FRONTEND_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-dazah-backend_default}
