services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_BASE_URL=${API_BASE_URL:-http://app:8000}
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1,0.0.0.0}
      # Keep the JS heap below the container limit so route compilation has native-memory headroom.
      - NODE_OPTIONS=--max-old-space-size=4096
      # Docker Desktop on Windows can miss bind-mount file events; polling keeps HMR reliable.
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - next-cache:/app/.next
    networks:
      - backend
    # Webpack is less memory-intensive than Turbopack for the mounted Windows workspace.
    command: pnpm dev:webpack --hostname 0.0.0.0 --port 3000
    restart: unless-stopped
    cpus: "${FRONTEND_DEV_CPU_LIMIT:-2.0}"
    mem_limit: "${FRONTEND_DEV_MEMORY_LIMIT:-6g}"
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-dazah-backend_default}

volumes:
  frontend_node_modules:
  next-cache:
