name: Frontend CI

on:
  push:
    branches: [main, dev/livzon-syntpharm]
  pull_request:
    branches: [main, dev/livzon-syntpharm]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run TypeScript check
        run: pnpm tsc --noEmit
      
      - name: Run linter
        run: pnpm lint || true
      
      - name: Build
        run: pnpm build
  
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Fetch backend OpenAPI spec
        run: |
          # Determine branch (use same branch name, fallback to main)
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Fetching openapi.json from backend branch: $BRANCH"
          
          # Clone backend repo with token authentication
          # Try the same branch first, then fallback to main
          if ! git clone --depth 1 --branch "$BRANCH" --single-branch \
            https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
            backend-temp 2>/dev/null; then
            echo "Branch $BRANCH not found in backend, trying main..."
            git clone --depth 1 --branch main --single-branch \
              https://x-access-token:${{ secrets.BACKEND_REPO_TOKEN }}@github.com/Livzon-DS-Sector-AI-Innovation/dazah-backend.git \
              backend-temp
          fi
          
          # Copy openapi.json to the expected location
          cp backend-temp/openapi.json src/types/generated/openapi.json
          rm -rf backend-temp
          
          echo "✓ Downloaded openapi.json from backend"
      
      - name: Generate API types
        run: |
          # Generate types from the downloaded spec
          npx openapi-typescript src/types/generated/openapi.json -o src/types/generated/schema.ts
      
      - name: Check for drift
        run: |
          if ! git diff --exit-code src/types/generated/schema.ts; then
            echo "❌ Generated types are out of date!"
            echo ""
            echo "The backend API has changed. Please update the frontend types:"
            echo "  1. Pull the latest backend changes"
            echo "  2. Run: pnpm generate:api"
            echo "  3. Commit the updated src/types/generated/schema.ts"
            exit 1
          fi
          echo "✓ Generated types are up to date"
