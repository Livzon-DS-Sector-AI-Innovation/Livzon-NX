# ═══════════════════════════════════════════════════════════════
# Hermes-Lite — Configuration
# ═══════════════════════════════════════════════════════════════
# This file is self-contained. All paths resolve relative to
# the project directory (HERMES_HOME is set to this folder).
# API keys go in .env, NOT here.
# ═══════════════════════════════════════════════════════════════

model:
  default: dazah-active-text
  provider: dazah

custom_providers:
  - name: dazah
    base_url: http://127.0.0.1:8000/api/v1/agent/llm
    api_mode: chat_completions
    models:
      dazah-active-text:
        name: Dazah active capability-routed model
        supports_vision: true
    model: dazah-active-text
    # The FastAPI adapter passes AGENT_LLM_PROXY_TOKEN explicitly.
    # CLI compatibility may use DAZAH_API_KEY with the same service token.

  - name: xiaomi
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_mode: chat_completions
    models:
      mimo-v2.5-pro:
        name: MiMo v2.5 Pro
    model: mimo-v2.5-pro
    # api_key resolved from .env → XIAOMI_API_KEY

  - name: ds
    base_url: https://api.deepseek.com
    api_mode: chat_completions
    models:
      deepseek-v4-pro:
        context_length: 1000000
        name: DeepSeek V4 Pro
      deepseek-v4-flash:
        context_length: 1000000
        name: DeepSeek V4 Flash
    model: deepseek-v4-pro
    # api_key resolved from .env → DEEPSEEK_API_KEY

# ── 记忆系统 ─────────────────────────────────
memory:
  memory_enabled: true        # 上游 CLI 记忆；Dazah Agent 使用下方租户隔离的 SQLite 用户记忆
  user_profile_enabled: true  # 上游 CLI 用户画像；Dazah Agent 不读取共享 USER.md
  memory_char_limit: 2200     # MEMORY.md 字符上限（严格控制，防止泄露面过大）
  user_char_limit: 1375       # USER.md 字符上限（前端展示，适度限制）
  nudge_interval: 0           # 禁用 memory nudge（Hermes-Lite 是 Web 产品，不向用户暴露 self-improvement 提示）
  user_memory_limit_bytes: 32768          # 每个 tenant_id + user_id 的有效记忆硬上限
  user_memory_compression_trigger: 0.80   # 达到 80% 后触发分层摘要
  user_memory_compression_target: 0.60    # 自动压缩的目标占用
  user_memory_injection_bytes: 6144       # 单次注入 Agent 上下文的最大 UTF-8 字节数

skills:
  creation_nudge_interval: 0  # 禁用 skill nudge（Hermes-Lite 用户无需 skill 管理提示）

# Web search backend
web:
  backend: tavily
