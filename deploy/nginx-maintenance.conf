# Include in every public server. Port 8090 is container loopback only;
# no request header, URL, cookie or client IP can bypass the public gate.
set $dazah_maintenance 0;
if (-f /run/dazah/maintenance) { set $dazah_maintenance 1; }
if ($server_port = 8090) { set $dazah_maintenance 0; }
if ($dazah_maintenance = 1) { return 503; }
set $dazah_frontend_encoding $http_accept_encoding;
if ($http_accept ~* text/html) { set $dazah_frontend_encoding ""; }
error_page 503 =503 @dazah_maintenance;
# A flag probe only; it never calls a business service. The server gate also
# blocks this endpoint while active, so it cannot be used as a bypass.
location = /__dazah_maintenance_status {
    add_header Cache-Control "no-store" always;
    default_type application/json;
    root /run/dazah;
    try_files /status.json =204;
}
location = /__dazah_maintenance_watch.js {
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 200 '(()=>{let busy=false;async function check(){if(busy||document.hidden)return;busy=true;try{const r=await fetch("/__dazah_maintenance_status",{cache:"no-store",credentials:"same-origin"});let state={phase:"normal"};if(r.status===503&&r.headers.get("X-Dazah-Maintenance")==="1")state={phase:"maintenance"};else if(r.status===200){const data=await r.json();if(data.phase==="announced"&&Number.isFinite(data.starts_at))state=data}else if(r.status!==204)return;window.dispatchEvent(new CustomEvent("dazah:maintenance",{detail:state}));if(!document.querySelector("[data-dazah-maintenance-boundary]")){let notice=document.getElementById("dazah-maintenance-fallback");if(state.phase!=="normal"){if(!notice){notice=document.createElement("div");notice.id="dazah-maintenance-fallback";notice.setAttribute("role","status");notice.style.cssText="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#fff3cd;color:#664d03;padding:16px;text-align:center";document.body.appendChild(notice)}notice.textContent=state.phase==="announced"?"系统即将维护，请及时保存。剩余 "+Math.max(0,Math.ceil(state.starts_at-Date.now()/1000))+" 秒":"系统维护中，页面输入已保留，请勿刷新或重复提交。恢复后先核对操作结果。"}else if(notice)notice.remove()}}catch{}finally{busy=false}}setInterval(check,5000);document.addEventListener("visibilitychange",check);check()})();';
}
location @dazah_maintenance {
    default_type text/html;
    charset utf-8;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
    add_header X-Dazah-Maintenance 1 always;
    add_header X-Content-Type-Options nosniff always;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dazah 系统维护中</title><style>body{margin:0;background:#f4f7fb;color:#24334b;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:48px;max-width:560px;margin:24px;box-shadow:0 12px 48px #24334b0d}.brand{color:#2563eb;font-weight:700;letter-spacing:3px}h1{font-size:30px}p{line-height:1.9;color:#64748b}.dot{display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:50%;margin-right:8px}small{color:#64748b}</style><main><div class="brand">DAZAH</div><h1>系统维护中，请稍候</h1><p>系统正在更新或恢复服务，暂时无法进行业务操作。所有检查完成后将自动恢复访问。</p><p>请保留当前工作，等待恢复后重新确认操作结果。</p><small><span class="dot"></span>正在检查服务状态 · 每 15 秒自动重试</small></main><script>setInterval(async()=>{try{const r=await fetch("/login",{method:"HEAD",cache:"no-store"});if(r.ok&&!r.headers.get("X-Dazah-Maintenance"))location.replace("/login")}catch{}},15000)</script></html>';
}
