services:
  nginx:
    image: nginx:1.27-alpine
    pull_policy: never
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/dazah/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
