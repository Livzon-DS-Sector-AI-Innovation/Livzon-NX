# Include from nginx http context (one copy only).
map $server_name $dazah_api_key { default "dazah-api"; }
limit_req_zone $dazah_api_key zone=dazah_api:1m rate=30r/s;
limit_conn_zone $dazah_api_key zone=dazah_connections:1m;
limit_conn_zone $server_name zone=dazah_streams:1m;
limit_conn_zone $server_name zone=dazah_mcp:1m;
map $http_content_type $dazah_upload_key {
    default "";
    ~*multipart/form-data "dazah-upload";
}
limit_conn_zone $dazah_upload_key zone=dazah_uploads:1m;
map $status $dazah_retry_after { default ""; 429 "10"; 503 "60"; }

# Container loopback only, used to drain active requests before stopping writers.
server {
    listen 127.0.0.1:8089;
    server_name localhost;
    location = /status { stub_status; }
}
