// Shared by image builds and CI runners, including Playwright install-deps.
Acquire::Retries "3";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Languages "none";
// Never accept a partially refreshed index after download retries are exhausted.
APT::Update::Error-Mode "any";
Binary::apt::APT::Keep-Downloaded-Packages "true";
