// Shared by image builds and CI runners, including Playwright install-deps.
Acquire::Retries "3";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Languages "none";
// Never accept a partially refreshed index after download retries are exhausted.
APT::Update::Error-Mode "any";
Binary::apt::APT::Keep-Downloaded-Packages "true";

// Build-cache refresh point.
// The Dockerfiles COPY this file before their apt layers, so any change here
// invalidates the CI build cache for those layers and makes
// `apt-get update && apt-get upgrade` run again. The shared build cache (gha
// scope) is not evicted while builds keep running, so Debian security updates
// only reach the images when these layers are rebuilt.
// 2026-11-27: refreshed so libpam 1.5.2-6+deb12u3 (CVE-2025-6020) enters the images.
