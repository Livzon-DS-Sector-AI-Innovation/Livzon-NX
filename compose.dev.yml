name: dazah-dev

# Local development orchestration. Invoke with:
# docker compose --env-file .env.local -f compose.dev.yml up -d --build

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-hermes-environment: &hermes-environment
  APP_ENV: development
  HERMES_HOME: /data/hermes
  HERMES_AGENT_TOKEN: ${HERMES_AGENT_TOKEN}
  HERMES_INTERNAL_TOKEN: ${HERMES_INTERNAL_TOKEN}
  HERMES_USER_MEMORY_KEYS: ${HERMES_USER_MEMORY_KEYS}
  HERMES_USER_MEMORY_REQUIRE_POLICY: ${HERMES_USER_MEMORY_REQUIRE_POLICY:-false}
  HERMES_FEISHU_CREDENTIAL_KEY: ${HERMES_FEISHU_CREDENTIAL_KEY}
  LARK_CLI_PATH: /usr/local/bin/lark-cli
  LARK_CLI_TIMEOUT_SECONDS: ${LARK_CLI_TIMEOUT_SECONDS:-90}
  HERMES_FEISHU_TMPFS: /run/hermes-feishu
  HERMES_GATEWAY_LOCK_DIR: /run/hermes-feishu/gateway-locks
  AGENT_LLM_PROXY_TOKEN: ${AGENT_LLM_PROXY_TOKEN}
  DAZAH_API_KEY: ${AGENT_LLM_PROXY_TOKEN}
  DAZAH_API_BASE_URL: http://app:8000/api/v1
  DAZAH_AGENT_TOOL_TOKEN: ${DAZAH_AGENT_TOOL_TOKEN}
  DAZAH_LLM_BASE_URL: http://app:8000/api/v1/agent/llm
  DAZAH_LLM_MODEL: ${DAZAH_LLM_MODEL:-dazah-active-text}
  HERMES_DAZAH_CHAT_TIMEOUT_SECONDS: ${HERMES_DAZAH_CHAT_TIMEOUT_SECONDS:-180}
  HERMES_DAZAH_MAX_TOOL_ITERATIONS: ${HERMES_DAZAH_MAX_TOOL_ITERATIONS:-30}
  WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dazah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    image: dazah/backend:dev
    env_file:
      - ${DAZAH_ENV_FILE:-.env.local}
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/dazah}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./dazah-backend/app:/app/app:ro
      - ./dazah-backend/alembic:/app/alembic
      - ./dazah-backend/alembic.ini:/app/alembic.ini:ro
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    image: dazah/backend:dev
    restart: unless-stopped
    env_file:
      - ${DAZAH_ENV_FILE:-.env.local}
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/dazah}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      HERMES_AGENT_V2_URL: http://hermes-lite:8100/v2/agent/runs
      HERMES_INTERNAL_URL: http://hermes-lite:8100
      AGENT_TOOL_TOKEN: ${DAZAH_AGENT_TOOL_TOKEN}
      AGENT_INTERNAL_API_BASE_URL: http://app:8000/api/v1
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    volumes:
      - ./dazah-backend/app:/app/app
      - ./dazah-backend/alembic:/app/alembic
      - ./dazah-backend/alembic.ini:/app/alembic.ini:ro
      - ./dazah-backend/data:/app/data
      - backend_uploads:/app/uploads
      - backend_storage:/app/storage
    ports:
      - "${BACKEND_BIND_HOST:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *default-logging

  hermes-lite:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: hermes
    image: dazah/hermes-lite:dev
    restart: unless-stopped
    init: true
    environment: *hermes-environment
    volumes:
      - ./Hermes-Lite:/app
      - hermes_data:/data/hermes
    tmpfs:
      - /run/hermes-feishu:mode=0700,uid=1000,gid=1000,size=32m
    ports:
      - "${HERMES_BIND_HOST:-127.0.0.1}:${HERMES_PORT:-8100}:8100"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging

  frontend-cache-init:
    image: dazah/frontend:dev
    user: "0:0"
    volumes:
      - frontend_next_cache:/app/.next
    command: ["sh", "-c", "chown -R node:node /app/.next"]
    restart: "no"
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    image: dazah/frontend:dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_BASE_URL: http://app:8000
      LOCAL_LOGIN_MODE: ${LOCAL_LOGIN_MODE:-enabled}
      NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1,0.0.0.0}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      # Next 16 webpack dev 全量重编译内存峰值可超 4GB，
      # 超限触发 "approaching the used memory threshold" 崩溃循环，上调至 8GB
      NODE_OPTIONS: --max-old-space-size=8192
    volumes:
      - ./dazah-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      frontend-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').createConnection(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.setTimeout(3000,()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *default-logging

networks:
  backend:
    name: dazah_dev_backend

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-dazah-backend_pgdata}
  redis_data:
    name: ${REDIS_DATA_VOLUME:-dazah-backend_redisdata}
  minio_data:
    name: ${MINIO_DATA_VOLUME:-dazah-backend_minio_data}
  backend_uploads:
    name: dazah_dev_backend_uploads
  backend_storage:
    name: dazah_dev_backend_storage
  hermes_data:
    name: ${HERMES_DATA_VOLUME:-hermes-lite_hermes_data}
  frontend_node_modules:
    name: ${FRONTEND_NODE_MODULES_VOLUME:-dazah-frontend_frontend_node_modules}
  frontend_next_cache:
    name: ${FRONTEND_NEXT_CACHE_VOLUME:-dazah-frontend_next-cache}
